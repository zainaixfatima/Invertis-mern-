<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <div class="card">
                <span>👤</span>
                <p><b>120</b><br>Users</p>
            </div>

            <div class="card">
                <span>💰</span>
                <p><b>Rs 45k</b><br>Sales</p>
            </div>

            <div class="card">
                <span>📦</span>
                <p><b>36</b><br>Orders</p>
            </div>

            <div class="card">
                <span>⭐</span>
                <p><b>4.8</b><br>Rating</p>
            </div>

            <div class="card">
                <span>💬</span>
                <p><b>18</b><br>Messages</p>
            </div>

            <div class="card">
                <span>✅</span>
                <p><b>92%</b><br>Done</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with CSS Grid</p>
        </footer>

    </div>

</body>
</html>
