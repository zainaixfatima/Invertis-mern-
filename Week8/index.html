<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <div class="card">
                <span>👤</span>
                <div>
                    <strong>120</strong>
                    <p>Users</p>
                </div>
            </div>

            <div class="card">
                <span>💰</span>
                <div>
                    <strong>Rs 45k</strong>
                    <p>Sales</p>
                </div>
            </div>

            <div class="card">
                <span>📦</span>
                <div>
                    <strong>36</strong>
                    <p>Orders</p>
                </div>
            </div>

            <div class="card">
                <span>⭐</span>
                <div>
                    <strong>4.8</strong>
                    <p>Rating</p>
                </div>
            </div>

            <div class="card">
                <span>💬</span>
                <div>
                    <strong>18</strong>
                    <p>Messages</p>
                </div>
            </div>

            <div class="card">
                <span>✅</span>
                <div>
                    <strong>92%</strong>
                    <p>Done</p>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <h4>Made with CSS Grid</h4>
        </footer>

    </div>

</body>
</html>
