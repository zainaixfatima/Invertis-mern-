<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Event Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <header id="hero">
        <h1>Tech club</h1>
        <p>learn. Code. Grow.</p>
        
    </header>

        <div class="card">
            <h2>Upcoming events</h2>
            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>
                </thead>
                <tbody>
                        
                    <tr>
                    <td>HTML Workshop</td>
                    <td>Lab 1</td>
                    <td>12 nov</td>
                    </tr>

                     <tr>
                    <td> Hackathon</td>
                    <td>20 nov</td>
                    <td>seminar hall</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="hero">
<h1>Register</h1>

    <form>
<label for="Name">Name:</label>
<input type="text" placeholder=" your name">
<br>
<label for="Email">Email:</label>
<input type="email" placeholder="your email">
</form>

<button type="submit">Register</button>
    </div>
    </main>

    

</body>
</html>
