<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body>
    <h1>Register</h1>
    <form>
<label for="Name">Name:</label>
<input type="text" id="name" placeholder="your name">
<br><br>
<label for="Email">Email:</label>
<input type="email" id="email" placeholder="your email">
<br><br>
<label for="password">password:</label>
<input type="password" id="password" placeholder="your password">
<br><br>
<label for="Date of birth">Date of birth:</label>
<input type="date" id="Date of birth" placeholder="your birthdate">
<br><br>
<label for="phone">Phone:</label>
<input type="tel" id="phone" placeholder="your phone">
<br><br>
<label for="gender">Gender:</label>
<label for="male">male:</label>
<input type="radio" id="male" >
<label for="female">female:</label>
<input type="radio" id="female">
<br><br>
<label for="Interests">Interests:</label>
<input type="checkbox" id="web">
<label for="web">web</label>
<label for="DSA">DSA:</label>
<input type="checkbox" id="DSA">
<br><br>
<label for="branch">Branch:</label>
<select id="event" name="event">
     <option value="">CSE</option>
<br><br>
<label for="message">Why do you want to join?</label> 
<br><br>
<textarea id="message" name="message" rows="5" cols="35"></textarea> 
<br><br>
 <button type="submit">Submit Registration</button>
  <button type="reset">Clear Form</button>





    </form>
</body>
</html>
